# Lenny Growth Assistant — one-command startup
#   docker compose up --build
# Then open http://localhost:5173
#
# Services:
#   db       PostgreSQL 16 (sessions, messages, artifacts)
#   backend  FastAPI + ChromaDB + embedding models (port 8001)
#   frontend Vite dev server proxying /api to the backend (port 5173)
#
# LLM keys: put GROQ_API_KEY / GEMINI_API_KEY in backend/.env (gitignored);
# Compose loads it automatically. Without keys, the Ollama and mock
# providers still work.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny_growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://lenny:lenny@db:5432/lenny_growth
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf-cache:/app/.cache/huggingface
      - chroma-data:/app/chroma_db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_ORIGIN: http://backend:8001
    depends_on:
      - backend

volumes:
  pgdata:
  hf-cache:
  chroma-data:
