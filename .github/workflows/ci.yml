name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          # Embedding + reranker models used by the retrieval tests
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: hf-models-

      - name: Run tests
        env:
          # Tests are hermetic (temp DB/vector store) and use the mock provider;
          # no real API keys are needed or used in CI.
          LLM_PROVIDER: mock
          # Keras 3 breaks transformers' optional TF backend; force the torch path
          USE_TF: "0"
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
